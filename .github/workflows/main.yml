name: AMS2.1 Java 8 Maven CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub 저장소 소스코드 불러오기
    - name: Check out repository
      uses: actions/checkout@v4

    # 2. Java 8 (Temurin JDK) 환경 구축 및 Maven 캐시 설정
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'maven' # 매번 라이브러리를 새로 받지 않고 캐시하여 빌드 속도 향상

    # 3. Maven 권한 부여 및 빌드 진행 (.war 생성)
    - name: Build with Maven
      run: mvn clean package -DskipTests=false